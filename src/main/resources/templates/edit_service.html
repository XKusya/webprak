<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование услуги</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>

<th:block th:replace="~{general :: page-header}"></th:block>

<div class="container mt-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="mb-0">Редактирование услуги</h1>
        <a class="btn btn-outline-secondary" th:href="@{/services/{id}(id=${service.id})}">К карточке</a>
    </div>

    <form th:action="@{/services/{id}/edit(id=${service.id})}" th:object="${service}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="card mb-4">
            <div class="card-header">Основные данные</div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="name">Название</label>
                        <input id="name" class="form-control" type="text" th:field="*{name}">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="serviceTypeId">Тип услуги</label>
                        <select id="serviceTypeId" class="form-control" th:field="*{serviceType.id}">
                            <option value="">Выберите тип</option>
                            <option th:each="type : ${serviceTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.name}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Описание</label>
                    <input id="description" class="form-control" type="text" th:field="*{description}">
                </div>
                <div class="form-group form-check">
                    <input id="isActive" class="form-check-input" type="checkbox" th:field="*{isActive}">
                    <label class="form-check-label" for="isActive">Активна</label>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Параметры тарификации</div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="unit">Единица</label>
                        <select id="unit" class="form-control" th:field="*{billing.unit}">
                            <option value="">Не указано</option>
                            <option value="PER_MIN">PER_MIN</option>
                            <option value="PER_MONTH">PER_MONTH</option>
                            <option value="PER_SMS">PER_SMS</option>
                        </select>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="basePrice">Базовая стоимость</label>
                        <input id="basePrice" class="form-control" type="number" step="0.01" th:field="*{billing.basePrice}">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="monthlyFee">Абонплата в месяц</label>
                        <input id="monthlyFee" class="form-control" type="number" step="0.01" th:field="*{billing.monthlyFee}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="includedMinutes">Включённые минуты</label>
                        <input id="includedMinutes" class="form-control" type="number" th:field="*{billing.includedMinutes}">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="callSetupFee">Плата за соединение</label>
                        <input id="callSetupFee" class="form-control" type="number" step="0.01" th:field="*{billing.callSetupFee}">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="quotaGb">Квота, ГБ</label>
                        <input id="quotaGb" class="form-control" type="number" th:field="*{billing.quotaGb}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="overagePricePerGb">Цена за 1 ГБ сверх квоты</label>
                        <input id="overagePricePerGb" class="form-control" type="number" step="0.01" th:field="*{billing.overagePricePerGb}">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="speedLimitAfterQuotaMbps">Скорость после квоты, Мбит/с</label>
                        <input id="speedLimitAfterQuotaMbps" class="form-control" type="number" th:field="*{billing.speedLimitAfterQuotaMbps}">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="bundleSize">Размер пакета SMS</label>
                        <input id="bundleSize" class="form-control" type="number" th:field="*{billing.bundleSize}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="bundlePrice">Стоимость пакета SMS</label>
                        <input id="bundlePrice" class="form-control" type="number" step="0.01" th:field="*{billing.bundlePrice}">
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex">
            <button class="btn btn-primary mr-2" type="submit">Сохранить</button>
            <a class="btn btn-outline-secondary" th:href="@{/services/{id}(id=${service.id})}">Отмена</a>
        </div>
    </form>
</div>

<th:block th:replace="~{general :: site-footer}"></th:block>
<th:block th:replace="~{general :: site-script}"></th:block>

</body>
</html>
