<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Операции</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>

<th:block th:replace="~{general :: page-header}"></th:block>

<div class="container mt-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="mb-0">Операции</h1>
        <div>
            <a class="btn btn-outline-primary mr-2" th:href="@{/operations/new}">Добавить операцию</a>
            <a class="btn btn-outline-secondary" th:href="@{/}">На главную</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Фильтры</div>
        <div class="card-body">
            <form th:action="@{/operations}" method="get">
                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label for="from">Период с</label>
                        <input id="from" class="form-control" type="date" name="from" th:value="${from}">
                    </div>
                    <div class="form-group col-md-3">
                        <label for="to">Период по</label>
                        <input id="to" class="form-control" type="date" name="to" th:value="${to}">
                    </div>
                    <div class="form-group col-md-3">
                        <label for="opType">Тип операции</label>
                        <select id="opType" class="form-control" name="opType">
                            <option value="">Все</option>
                            <option th:each="type : ${opTypes}"
                                    th:value="${type}"
                                    th:text="${type}"
                                    th:selected="${type == opType}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label for="clientId">Клиент</label>
                        <select id="clientId" class="form-control" name="clientId">
                            <option value="">Все</option>
                            <option th:each="client : ${clients}"
                                    th:value="${client.id}"
                                    th:text="${client.name}"
                                    th:selected="${client.id == clientId}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="serviceId">Услуга</label>
                        <select id="serviceId" class="form-control" name="serviceId">
                            <option value="">Все</option>
                            <option th:each="service : ${services}"
                                    th:value="${service.id}"
                                    th:text="${service.name}"
                                    th:selected="${service.id == serviceId}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="d-flex">
                    <button class="btn btn-primary mr-2" type="submit">Показать</button>
                    <a class="btn btn-outline-secondary" th:href="@{/operations}">Сбросить</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
            <tr>
                <th>Дата/время</th>
                <th>Тип</th>
                <th>Сумма</th>
                <th>Клиент</th>
                <th>Услуга</th>
                <th>Описание</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${operations == null || #lists.isEmpty(operations)}">
                <td colspan="6" class="text-center">Нет операций</td>
            </tr>
            <tr th:each="op : ${operations}">
                <td th:text="${op.opTime}"></td>
                <td th:text="${op.opType}"></td>
                <td th:text="${op.amount}"></td>
                <td>
                    <a th:href="@{/clients/{id}(id=${op.account.client.id})}"
                       th:text="${op.account.client.name}">Client</a>
                </td>
                <td>
                    <a th:if="${op.subscription != null}"
                       th:href="@{/services/{id}(id=${op.subscription.service.id})}"
                       th:text="${op.subscription.service.name}">Service</a>
                    <span th:if="${op.subscription == null}">-</span>
                </td>
                <td th:text="${op.description}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<th:block th:replace="~{general :: site-footer}"></th:block>
<th:block th:replace="~{general :: site-script}"></th:block>

</body>
</html>
