<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клиенты</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>

<th:block th:replace="~{general :: page-header}"></th:block>

<div class="container mt-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="mb-0">Клиенты</h1>
        <div>
            <a class="btn btn-outline-primary mr-2" th:href="@{/clients/new}">Добавить клиента</a>
            <a class="btn btn-outline-secondary" th:href="@{/}">На главную</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Фильтры</div>
        <div class="card-body">
            <form th:action="@{/clients}" method="get">
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="name">Поиск по имени/названию</label>
                        <input id="name" class="form-control" type="text" name="name" th:value="${name}">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="clientType">Тип клиента</label>
                        <select id="clientType" class="form-control" name="clientType">
                            <option value="">Все</option>
                            <option th:each="type : ${clientTypes}"
                                    th:value="${type}"
                                    th:text="${type}"
                                    th:selected="${type == clientType}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="accountState">Состояние счета</label>
                        <select id="accountState" class="form-control" name="accountState">
                            <option th:each="state : ${accountStates}"
                                    th:value="${state}"
                                    th:text="${state.label}"
                                    th:selected="${state == accountState}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="serviceId">Услуга</label>
                        <select id="serviceId" class="form-control" name="serviceId">
                            <option value="">Все</option>
                            <option th:each="service : ${services}"
                                    th:value="${service.id}"
                                    th:text="${service.name}"
                                    th:selected="${service.id == serviceId}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="from">Период с</label>
                        <input id="from" class="form-control" type="date" name="from" th:value="${from}">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="to">Период по</label>
                        <input id="to" class="form-control" type="date" name="to" th:value="${to}">
                    </div>
                </div>
                <div class="d-flex">
                    <button class="btn btn-primary mr-2" type="submit">Найти</button>
                    <a class="btn btn-outline-secondary" th:href="@{/clients}">Сбросить</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Тип</th>
                <th>Имя</th>
                <th>Баланс</th>
                <th>Кредитный лимит</th>
                <th>Срок погашения задолженности</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
                        <tr th:each="client : ${clients}">
                <td th:text="${client.id}"></td>
                <td th:text="${client.clientType}"></td>
                <td th:text="${client.name}"></td>
                <td th:text="${client.account != null ? client.account.balance : '-'}"></td>
                <td th:text="${client.account != null ? client.account.creditLimit : '-'}"></td>
                <td th:text="${client.account != null ? client.account.debtDueDate : '-'}"></td>
                <td th:text="${client.createdAt}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary mr-2" th:href="@{/clients/{id}(id=${client.id})}">
                        Просмотреть
                    </a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/clients/{id}/edit(id=${client.id})}">
                        Редактировать
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<th:block th:replace="~{general :: site-footer}"></th:block>
<th:block th:replace="~{general :: site-script}"></th:block>

</body>
</html>
