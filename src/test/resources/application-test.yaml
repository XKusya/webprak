spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: postgres
    password: password
  docker:
    compose:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
